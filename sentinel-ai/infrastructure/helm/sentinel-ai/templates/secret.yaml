{{- if .Values.secrets.create }}
{{- /* Development only. Every required value must be supplied; nothing is generated, so nothing weak can slip in. */ -}}
{{- $s := .Values.secrets.values -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinel.fullname" . }}-secrets
  labels: {{- include "sentinel.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k := list "postgres-password" "app-db-password" "api-key-hash-pepper" "jwt-access-secret" "security-engine-token" "document-scanner-token" "vault-token" "vault-master-keys" "redis-password" }}
  {{ $k }}: {{ required (printf "secrets.values.%s is required when secrets.create=true" $k) (index $s $k) | quote }}
  {{- end }}
  {{- range $k := list "provider-credential-keys" "gemini-api-key" "openai-api-key" "anthropic-api-key" }}
  {{- with (index $s $k) }}
  {{ $k }}: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}

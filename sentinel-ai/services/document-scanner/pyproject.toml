[project]
name = "sentinel-document-scanner"
version = "0.1.0"
description = "SentinelAI document scanner: file validation, malware-scan interface, text extraction, OCR"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "pypdf>=5.0", "defusedxml>=0.7.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.13,<2", "types-defusedxml>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
# Application code is type-checked strictly; tests run with check_untyped_defs (see scripts/development/typecheck-python.sh).
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
# Pillow is an optional, test-only dependency (real-OCR tests render an image with it and skip without it).
module = ["PIL", "PIL.*"]
ignore_missing_imports = true

[project]
name = "sentinel-token-vault"
version = "0.1.0"
description = "SentinelAI de-tokenization vault: deterministic per-session tokens, encrypted at rest in Redis with a hard TTL"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "redis>=5.0", "cryptography>=43"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "fakeredis>=2.26", "ruff>=0.5", "mypy>=1.13,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
# Application code is type-checked strictly; tests run with check_untyped_defs (see scripts/development/typecheck-python.sh).
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

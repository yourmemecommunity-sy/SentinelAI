[project]
name = "sentinel-security-engine"
version = "0.1.0"
description = "SentinelAI security engine: detectors, sanitization, policy evaluation, risk scoring"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6",
    # NER layer: spaCy + a pinned English model, run locally (app/detectors/ner)
    "spacy>=3.8,<3.9",
    "en_core_web_md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
    # tier 2 classifier (local ONNX) and tier 3 judge (optional; Anthropic SDK)
    "onnxruntime>=1.20,<2", "tokenizers>=0.20,<1", "numpy>=1.26", "anthropic>=0.69,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.13,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
# Application code is type-checked strictly; tests run with check_untyped_defs (see scripts/development/typecheck-python.sh).
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

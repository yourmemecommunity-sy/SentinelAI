name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

# The git repository root is the folder ABOVE sentinel-ai/, and GitHub only reads workflows from .github/workflows at the
# repository root - so this file lives there and every `run:` step starts in sentinel-ai/ (step-level working-directory
# values below are relative to the repository root, so they carry the sentinel-ai/ prefix explicitly).
defaults:
  run:
    working-directory: sentinel-ai

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Validate repository structure (fails CI on any violation)
        run: node scripts/development/validate-structure.mjs
      - name: Structure validator tests
        run: node --test tests/unit/validate-structure.test.mjs

  security-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Install
        working-directory: sentinel-ai/services/security-engine
        run: pip install -e ".[dev]"
      - name: Unit + integration tests
        working-directory: sentinel-ai/services/security-engine
        run: python -m pytest -q
      - name: Security evaluation gate (any critical regression fails CI)
        run: python scripts/security/run_evaluation.py --report evaluation-report.json
      - name: Security + regression tests (PyYAML is needed by the OpenAPI contract tests, which otherwise skip silently)
        run: |
          pip install "pyyaml>=6,<7"
          python -m pytest tests/security tests/regression -q -rs
      - name: Dataset is reproducible (no drift from generator)
        run: |
          python scripts/dataset/generate_synthetic_datasets.py
          git diff --exit-code datasets/
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: evaluation-report, path: sentinel-ai/evaluation-report.json }

  document-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Install
        working-directory: sentinel-ai/services/document-scanner
        run: pip install -e ".[dev]"
      - name: Unit + hostile-file + API tests
        working-directory: sentinel-ai/services/document-scanner
        run: python -m pytest -q

  python-typecheck:
    # mypy, configured in each package's pyproject.toml: application code strict, test bodies type-checked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Install every Python package with its dev extras (mypy checks against the real dependency types)
        run: |
          for p in services/security-engine services/token-vault services/document-scanner services/policy-engine packages/sdk/python; do
            pip install -e "${p}[dev]"
          done
      - name: Type check (mypy)
        run: bash scripts/development/typecheck-python.sh

  token-vault:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Install
        working-directory: sentinel-ai/services/token-vault
        run: pip install -e ".[dev]"
      - name: Vault tests (fakeredis)
        working-directory: sentinel-ai/services/token-vault
        run: python -m pytest -q
      - name: Vault tests against a REAL Redis server
        working-directory: sentinel-ai/services/token-vault
        run: python -m pytest -q
        env: { VAULT_TEST_REDIS_URL: "redis://localhost:6379/0" }

  gateway:
    # TypeScript packages + Postgres migrations/RLS/tenant-isolation tests (PGlite AND a real PostgreSQL 18) + gateway<->real-engine e2e.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_PASSWORD: ci-only-password }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # No `version:` here on purpose: package.json's `packageManager` field pins pnpm, and action-setup v4 fails when
      # both are set ("Multiple versions of pnpm specified"). It must be told where that package.json is.
      - uses: pnpm/action-setup@v4
        with: { package_json_file: sentinel-ai/package.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Install engine + document scanner (needed by the e2e tests)
        run: |
          pip install -e "services/security-engine[dev]"
          pip install -e "services/document-scanner[dev]"
          pip install -e "services/token-vault[dev]"
      - run: pnpm install --frozen-lockfile
      - name: Typecheck + build all packages
        run: pnpm build
      - name: Unit, tenant-isolation and migration tests
        run: pnpm test
        env: { SENTINEL_E2E_PYTHON: python }
      - name: Database suites on a REAL PostgreSQL 18 (RLS, tenant isolation, migrations, triggers)
        run: pnpm --filter @sentinelai/api exec vitest run tests/db
        env: { SENTINEL_TEST_DATABASE_URL: "postgresql://postgres:ci-only-password@localhost:5432/postgres" }
      - name: Python SDK tests
        run: python -m pytest packages/sdk/python/tests -q
      - name: Audit Node dependencies
        run: pnpm audit --prod --audit-level=high

  dependency-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: pip-audit (Python dependencies)
        run: |
          pip install pip-audit
          pip-audit -r services/security-engine/requirements.txt
          pip-audit -r services/document-scanner/requirements.txt
          pip-audit -r services/token-vault/requirements.txt

  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }                     # scan the full history, not just the tip
      - name: gitleaks over the full git history (default rules; .gitleaks.toml has no allow-list)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:v8.21.2 git /repo --config /repo/sentinel-ai/.gitleaks.toml --redact --no-banner

  containers:
    runs-on: ubuntu-latest
    needs: [gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway secrets
        run: bash scripts/development/docker-secrets.sh
      - name: Build every image
        run: docker compose build
      - name: Trivy - fail on fixable HIGH/CRITICAL in any image
        run: |
          for img in api dashboard security-engine token-vault document-scanner policy-engine; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image               --exit-code 1 --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed "sentinel-ai/$img:local"
          done
      - name: Trivy - Dockerfile misconfiguration (HIGH/CRITICAL fail)
        run: docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.58.1 config --exit-code 1 --severity HIGH,CRITICAL /src
      - name: Start the stack and run the container verification suite
        run: |
          docker compose up -d
          bash scripts/development/docker-up.sh
          bash scripts/development/docker-verify.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
